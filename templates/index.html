<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanofluid Heat Transfer Prediction</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --background-start: #f5f7fa;
            --background-end: #c3cfe2;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--background-start) 0%, var(--background-end) 100%);
            color: var(--text-color);
        }

        .main-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h1, h2 {
            text-align: center;
            color: var(--primary-color);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-retrain {
            background-color: var(--warning-color);
            color: #333;
            margin-top: 1rem;
        }

        .btn-retrain:hover {
            background-color: #e0a800;
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e8f4fd;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .result-value {
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Model Info Box Styles */
        .model-info-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .model-info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }

        .model-info-row:last-child {
            border-bottom: none;
        }

        .model-info-label {
            font-weight: 600;
            color: #666;
        }

        .model-info-value {
            font-weight: bold;
            color: var(--text-color);
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-good {
            background-color: #d4edda;
            color: #155724;
        }

        .status-warning {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-bad {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Performance Bar */
        .performance-container {
            margin-top: 1rem;
        }

        .performance-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }

        .performance-bar {
            height: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .performance-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        /* Retrain Status */
        #retrainStatus {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .retrain-progress {
            background-color: #cce5ff;
            color: #004085;
        }

        .retrain-success {
            background-color: #d4edda;
            color: #155724;
        }

        .retrain-error {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Auto Retrain Alert */
        .auto-retrain-alert {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 6px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
            margin-top: 0.5rem;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .btn-reset {
            background-color: #6c757d;
            color: white;
            margin-top: 0.5rem;
        }

        .btn-reset:hover {
            background-color: #5a6268;
        }

        .drift-status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            text-align: center;
            display: none;
        }

        .drift-alert {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .drift-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .button-group button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Model Info Panel -->
        <div class="container">
            <h2>Current Model Info</h2>
            
            <div class="auto-retrain-alert" id="autoRetrainAlert">
                Performance dropped! Auto-retraining recommended.
            </div>
            
            <div class="model-info-box" id="modelInfoBox">
                <div class="model-info-row">
                    <span class="model-info-label">Model Name</span>
                    <span class="model-info-value" id="modelName">Loading...</span>
                </div>
                <div class="model-info-row">
                    <span class="model-info-label">Run ID</span>
                    <span class="model-info-value" id="modelRunId" style="font-size: 0.85rem;">-</span>
                </div>
                <div class="model-info-row">
                    <span class="model-info-label">Algorithm</span>
                    <span class="model-info-value" id="modelType">-</span>
                </div>
                <div class="model-info-row">
                    <span class="model-info-label">R2 Score</span>
                    <span class="model-info-value" id="modelR2">-</span>
                </div>
                <div class="model-info-row">
                    <span class="model-info-label">MSE</span>
                    <span class="model-info-value" id="modelMSE">-</span>
                </div>
                <div class="model-info-row">
                    <span class="model-info-label">Status</span>
                    <span class="model-info-value">
                        <span class="status-badge" id="modelStatus">-</span>
                    </span>
                </div>
            </div>
            
            <!-- Performance Bar -->
            <div class="performance-container">
                <div class="performance-label">
                    <span>Performance (R2) <span id="r2Source" style="font-size: 0.8rem; color: #666;"></span></span>
                    <span id="performancePercent">-</span>
                </div>
                <div class="performance-bar">
                    <div class="performance-fill" id="performanceFill" style="width: 0%; background-color: #28a745;"></div>
                </div>
                <div style="margin-top: 0.5rem; font-size: 0.85rem; color: #666;">
                    <span>Training R2: <strong id="trainingR2">-</strong></span>
                    <span style="margin-left: 1rem;">Realtime R2: <strong id="realtimeR2">-</strong></span>
                    <span style="margin-left: 0.5rem; font-size: 0.8rem;" id="sampleCount"></span>
                </div>
            </div>
            
            <!-- Button Group -->
            <div class="button-group">
                <button class="btn-retrain" id="retrainBtn" onclick="retrainModel()">
                    Retrain Model
                </button>
                <button class="btn-danger" id="driftBtn" onclick="simulateDrift()">
                    Simulate Drift
                </button>
                <button class="btn-reset" id="resetBtn" onclick="resetDrift()">
                    Reset
                </button>
            </div>
            
            <div id="driftStatus" class="drift-status"></div>
            <div id="retrainStatus"></div>
        </div>

        <!-- Prediction Panel -->
        <div class="container">
            <h1>Nanofluid Heat Transfer Predictor</h1>
            <form id="predictionForm">
                <div class="form-group">
                    <label for="eta">Eta (n)</label>
                    <input type="number" id="eta" name="eta" step="any" placeholder="e.g., 0.1" required>
                </div>
                <div class="form-group">
                    <label for="f">f</label>
                    <input type="number" id="f" name="f" step="any" placeholder="e.g., 0.5" required>
                </div>
                <div class="form-group">
                    <label for="f_prime">f_prime (f')</label>
                    <input type="number" id="f_prime" name="f_prime" step="any" placeholder="e.g., 1.0" required>
                </div>
                <button type="submit">Predict</button>
            </form>
            <div id="result">
                Prediction: <span class="result-value" id="predictionValue"></span>
            </div>
        </div>
    </div>

    <script>
        // Performance threshold for auto-retrain alert
        const PERFORMANCE_THRESHOLD = 0.95;  // R2 below this triggers warning

        // Load model info on page load
        async function loadModelInfo() {
            try {
                const response = await fetch('/model-info');
                if (!response.ok) {
                    document.getElementById('modelName').textContent = 'Not loaded';
                    document.getElementById('modelStatus').textContent = 'Error';
                    document.getElementById('modelStatus').className = 'status-badge status-bad';
                    return;
                }

                const info = await response.json();
                
                document.getElementById('modelName').textContent = info.name || 'Unknown';
                // Show run_id (truncated for display)
                const runId = info.run_id || '-';
                document.getElementById('modelRunId').textContent = runId.length > 12 ? runId.substring(0, 12) + '...' : runId;
                document.getElementById('modelRunId').title = runId;  // Full ID on hover
                document.getElementById('modelType').textContent = info.model_type || 'Unknown';
                
                const trainingR2 = parseFloat(info.training_r2);
                const realtimeR2 = info.realtime_r2;
                const displayR2 = parseFloat(info.display_r2);
                const mse = parseFloat(info.mse);
                const sampleCount = info.realtime_sample_count || 0;
                const r2Source = info.r2_source;
                
                document.getElementById('modelR2').textContent = isNaN(trainingR2) ? '-' : trainingR2.toFixed(6);
                document.getElementById('modelMSE').textContent = isNaN(mse) ? '-' : mse.toFixed(6);
                
                // Update training and realtime R2 display
                document.getElementById('trainingR2').textContent = isNaN(trainingR2) ? '-' : (trainingR2 * 100).toFixed(1) + '%';
                document.getElementById('realtimeR2').textContent = realtimeR2 !== null ? (realtimeR2 * 100).toFixed(1) + '%' : '-';
                document.getElementById('sampleCount').textContent = sampleCount > 0 ? `(${sampleCount} samples)` : '';
                document.getElementById('r2Source').textContent = r2Source === 'realtime' ? '[Realtime]' : '[Training]';
                
                // Update performance bar using display_r2 (which considers realtime if available)
                if (!isNaN(displayR2)) {
                    const percent = Math.max(0, Math.min(100, displayR2 * 100));
                    document.getElementById('performancePercent').textContent = percent.toFixed(1) + '%';
                    document.getElementById('performanceFill').style.width = Math.max(0, percent) + '%';
                    
                    // Color based on performance
                    let color = '#28a745';  // green
                    if (displayR2 < 0.9) color = '#dc3545';  // red
                    else if (displayR2 < PERFORMANCE_THRESHOLD) color = '#ffc107';  // yellow
                    document.getElementById('performanceFill').style.backgroundColor = color;
                    
                    // Update status badge
                    if (displayR2 >= PERFORMANCE_THRESHOLD) {
                        document.getElementById('modelStatus').textContent = 'Good';
                        document.getElementById('modelStatus').className = 'status-badge status-good';
                        document.getElementById('autoRetrainAlert').style.display = 'none';
                    } else if (displayR2 >= 0.9) {
                        document.getElementById('modelStatus').textContent = 'Warning';
                        document.getElementById('modelStatus').className = 'status-badge status-warning';
                        document.getElementById('autoRetrainAlert').style.display = 'block';
                    } else {
                        document.getElementById('modelStatus').textContent = 'Poor';
                        document.getElementById('modelStatus').className = 'status-badge status-bad';
                        document.getElementById('autoRetrainAlert').style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading model info:', error);
                document.getElementById('modelName').textContent = 'Error loading';
            }
        }

        // Simulate data drift
        async function simulateDrift() {
            const btn = document.getElementById('driftBtn');
            const status = document.getElementById('driftStatus');
            
            btn.disabled = true;
            btn.textContent = 'Simulating...';
            status.style.display = 'block';
            status.className = 'drift-status drift-info';
            status.textContent = 'Sending abnormal data to trigger drift detection...';
            
            try {
                const response = await fetch('/simulate-drift', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    status.className = 'drift-status drift-alert';
                    const realtimeR2 = result.realtime_r2 !== null ? (result.realtime_r2 * 100).toFixed(1) + '%' : 'N/A';
                    status.innerHTML = `
                        <strong>Drift Detected!</strong><br>
                        Drift Scores: eta=${result.drift_scores.eta.toFixed(2)}, 
                        f=${result.drift_scores.f.toFixed(2)}, 
                        f_prime=${result.drift_scores.f_prime.toFixed(2)}<br>
                        <strong>Realtime Performance: R2 = ${realtimeR2}</strong> (${result.sample_count} samples)<br>
                        ${result.auto_retrain_triggered ? '<br><strong>Auto-retrain triggered!</strong>' : 'Click "Retrain Model" to fix.'}
                    `;
                    document.getElementById('autoRetrainAlert').style.display = 'block';
                    document.getElementById('autoRetrainAlert').textContent = 'Performance dropped! Retraining recommended.';
                    
                    // Immediately update model info to reflect new performance
                    loadModelInfo();
                    
                    // If auto-retrain was triggered, wait and reload
                    if (result.auto_retrain_triggered) {
                        setTimeout(() => {
                            status.className = 'drift-status drift-info';
                            status.textContent = 'Auto-retraining in progress... Please wait.';
                        }, 2000);
                        
                        // Poll for retrain completion
                        checkRetrainStatus();
                    }
                } else {
                    status.className = 'drift-status drift-info';
                    status.textContent = 'Error: ' + (result.error || 'Unknown error');
                }
            } catch (error) {
                status.className = 'drift-status drift-info';
                status.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Simulate Drift';
            }
        }

        // Reset drift and performance tracking
        async function resetDrift() {
            const btn = document.getElementById('resetBtn');
            const status = document.getElementById('driftStatus');
            
            btn.disabled = true;
            btn.textContent = 'Resetting...';
            
            try {
                const response = await fetch('/reset-drift', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    status.style.display = 'block';
                    status.className = 'drift-status drift-info';
                    status.textContent = 'Drift detection and performance tracking reset successfully.';
                    document.getElementById('autoRetrainAlert').style.display = 'none';
                    
                    // Reload model info to reflect reset
                    loadModelInfo();
                    
                    // Hide status after 3 seconds
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                } else {
                    status.className = 'drift-status drift-alert';
                    status.textContent = 'Reset failed: ' + (result.error || 'Unknown error');
                }
            } catch (error) {
                status.style.display = 'block';
                status.className = 'drift-status drift-alert';
                status.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset';
            }
        }

        // Check retrain status periodically
        async function checkRetrainStatus() {
            const status = document.getElementById('driftStatus');
            let attempts = 0;
            const maxAttempts = 30;  // 30 * 2s = 60s max wait
            
            const interval = setInterval(async () => {
                attempts++;
                try {
                    const response = await fetch('/retrain-status');
                    const result = await response.json();
                    
                    if (!result.is_retraining) {
                        clearInterval(interval);
                        status.className = 'drift-status drift-info';
                        status.innerHTML = '<strong>Auto-retrain complete!</strong> Model reloaded.';
                        document.getElementById('autoRetrainAlert').style.display = 'none';
                        loadModelInfo();
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        status.textContent = 'Retrain taking longer than expected...';
                    }
                } catch (e) {
                    // Ignore errors, keep polling
                }
            }, 2000);
        }

        // Retrain model
        async function retrainModel() {
            const btn = document.getElementById('retrainBtn');
            const status = document.getElementById('retrainStatus');
            
            btn.disabled = true;
            btn.textContent = 'Retraining...';
            status.style.display = 'block';
            status.className = 'retrain-progress';
            status.textContent = 'Training in progress... This may take a minute.';
            
            try {
                const response = await fetch('/retrain', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    status.className = 'retrain-success';
                    status.innerHTML = `
                        Retraining complete!<br>
                        Best model: ${result.best_model}<br>
                        R2: ${result.r2.toFixed(6)}
                    `;
                    // Reload model info after retrain
                    setTimeout(() => {
                        loadModelInfo();
                        document.getElementById('autoRetrainAlert').style.display = 'none';
                    }, 1000);
                } else {
                    status.className = 'retrain-error';
                    status.textContent = 'Retrain failed: ' + (result.error || 'Unknown error');
                }
            } catch (error) {
                status.className = 'retrain-error';
                status.textContent = 'Error: ' + error.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Retrain Model';
            }
        }

        // Prediction form handler
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const button = this.querySelector('button');
            const resultDiv = document.getElementById('result');
            const predictionValueSpan = document.getElementById('predictionValue');
            
            button.classList.add('loading');
            button.textContent = 'Predicting...';
            resultDiv.style.display = 'none';

            const data = {
                eta: parseFloat(document.getElementById('eta').value),
                f: parseFloat(document.getElementById('f').value),
                f_prime: parseFloat(document.getElementById('f_prime').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify([data])
                });

                if (!response.ok) {
                    throw new Error('Prediction failed');
                }

                const result = await response.json();
                predictionValueSpan.textContent = result.predictions[0].toFixed(5);
                resultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during prediction. Please try again.');
            } finally {
                button.classList.remove('loading');
                button.textContent = 'Predict';
            }
        });

        // Load model info on page load
        loadModelInfo();
        
        // Refresh model info every 30 seconds
        setInterval(loadModelInfo, 30000);
    </script>
</body>
</html>
